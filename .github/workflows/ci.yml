name: CI

on:
  push:
    branches: [master, main, develop, "feature/**", "feat/**", "bugfix/**"]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build ${{ matrix.compiler }}

      - name: Configure
        run: meson setup build

      - name: Build
        run: ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs